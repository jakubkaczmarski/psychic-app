<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psychic Studio</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Psychic Studio</h1>
      <p>Where the psychics' characters are written.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <p id="login-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </main>

  <div id="app" class="layout" hidden>
    <nav class="sidebar" aria-label="Psychics">
      <div class="brand">Psychic Studio</div>
      <ul id="psychic-list" class="psychic-list"></ul>
      <button id="new-psychic" class="ghost" type="button">New psychic</button>
      <button id="sign-out" class="link" type="button">Sign out</button>
    </nav>
    <section id="editor" class="editor" aria-live="polite"></section>
  </div>


  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
